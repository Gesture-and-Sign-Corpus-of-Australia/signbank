name: Auslan Signbank

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build release
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.output.outputs.artifact_name }}
      artifact_filename: ${{ steps.output.outputs.artifact_filename }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up Elixir
        uses: erlef/setup-beam@v1.20.3
        with:
          version-type: strict
          version-file: .tool-versions
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Set release version
        run: |
          echo "VERSION=$(grep 'version:' mix.exs | cut -d '"' -f2)" >> $GITHUB_ENV
      - name: Release v${{ env.VERSION }}
        run: |
          mix compile
          mix assets.deploy
          mix release
        env:
          MIX_ENV: prod
      - name: Set job output
        id: output
        run: |
          echo "artifact_name=signbank-${{ env.VERSION }}" >> "$GITHUB_OUTPUT"
          echo "artifact_filename=signbank-${{ env.VERSION }}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signbank-${{ env.VERSION }}
          path: _build/prod/signbank-${{ env.VERSION }}.tar.gz

  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: https://uat.auslan.org.au
    needs: build

    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
      - name: Ensure script is executable
        run: chmod +x ./scripts/deploy.sh
      - name: Copy build artefact tar onto remote
        run: scp -i #{{secrets.STAGING_SSH_PRIVATE_KEY}} ${{ needs.build.outputs.artifact_name }} ${{vars.STAGING_REMOTE_USER}}@${{ vars.STAGING_REMOTE_HOST }}:~/
      - name: Untar, move, and run release
        run: cat ./scripts/deploy.sh | ssh -i ${{secrets.STAGING_SSH_PRIVATE_KEY}} ${{vars.STAGING_REMOTE_USER}}@${{ vars.STAGING_REMOTE_HOST }}
